---
layout: default
---
<div class="reading-layout">
<article class="post h-entry" itemscope itemtype="http://schema.org/BlogPosting">
  <meta itemprop="image" content="{{ page.image | default: '/assets/social-share.jpg' | absolute_url }}">
  <span itemprop="author" itemscope itemtype="http://schema.org/Person"><meta itemprop="name" content="Skyler"></span>
  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">{{ page.title | escape }}</h1>
    {% if page.subtitle %}<p class="post-subtitle">{{ page.subtitle }}</p>{% endif %}
    <p class="post-meta"><time class="dt-published" datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">{{ page.date | date: "%b %-d, %Y" }}</time></p>
  </header>
  <div class="post-content e-content" itemprop="articleBody">
    {{ content }}
  </div>
  <a class="u-url" href="{{ page.url | relative_url }}" hidden></a>
</article>
{% include more-reading.html %}
</div>
